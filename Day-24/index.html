<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockly — Inventory Dashboard</title><link rel="stylesheet" href="css/style.css">

<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar">

  <div class="workspace"><span class="workspace-icon">✦</span><div><b>Workspace</b><small>My business</small></div><span class="chevron">⌄</span></div>
  <p class="nav-label">WORKSPACE</p>
  <nav id="sideNav">
    <button class="nav-link active" data-page="dashboard"><span>▦</span> Dashboard</button>
    <button class="nav-link" data-page="products"><span>▣</span> Products</button>

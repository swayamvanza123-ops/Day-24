<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Stockly</title><link rel="stylesheet" href="css/style.css"></head><body class="login-body"><main class="login-card"><a class="brand login-brand"><span class="brand-mark">S</span><span>stockly<small>INVENTORY SUITE</small></span></a><div class="login-art">✦</div><p class="eyebrow">WELCOME BACK</p><h1>Good to see you<br>again.</h1><p class="muted">Sign in to manage your products, sales and stock in one place.</p><form id="loginForm"><label>Email address</label><input id="email" type="email" value="admin@stockly.com" required><label>Password</label><input id="password" type="password" value="admin123" required><button class="btn primary full" type="submit">Sign in to workspace →</button><p class="login-hint">Demo login: admin@stockly.com / admin123</p><p id="loginError" class="error-text"></p></form></main><script src="js/storage.js"></script><script src="js/auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const result=Auth.login(document.getElementById('email').value,document.getElementById('password').value);if(result){location.href='index.html'}else{document.getElementById('loginError').textContent='Email or password is incorrect.'}});</script></body></html>
